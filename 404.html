<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شگفتا | 404</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:#c9f0ff;
}

.game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* نوشته */

.info{
    text-align:center;
    padding-top:30px;
    position:relative;
    z-index:10;
}

.info h1{
    font-size:70px;
    margin:0;
    color:#6d4c41;
}

.info h2{
    color:#6d4c41;
}

.info p{
    color:#555;
}

/* امتیاز */

.score{
    position:absolute;
    top:20px;
    left:20px;
    background:white;
    padding:10px 18px;
    border-radius:15px;
    font-size:20px;
    z-index:20;
}

/* زمین */

.ground{
    position:absolute;
    bottom:140px;
    left:0;
    width:100%;
    height:8px;
    background:#6d4c41;
}

/* آدمک */

.player{
    position:absolute;
    left:100px;
    bottom:148px;
    width:60px;
    height:70px;
    font-size:55px;
    z-index:5;
}

/* پرش */

.player.jump{
    animation:jump .7s ease-out;
}

@keyframes jump{

    0%{
        bottom:88px;
    }

    50%{
        bottom:270px;
    }

    100%{
        bottom:88px;
    }

}

/* مانع */

.obstacle{
    position:absolute;
    right:-80px;
    bottom:88px;

    width:60px;
    height:70px;

    font-size:55px;

    animation:obstacleMove 2.5s linear;
}

@keyframes obstacleMove{

    from{
        right:-80px;
    }

    to{
        right:110%;
    }

}

/* دکمه */

.home{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);

    background:#8d6e63;
    color:white;

    text-decoration:none;

    padding:12px 25px;

    border-radius:15px;

    z-index:30;
}

/* پایان */

.gameover{
    display:none;

    position:absolute;

    inset:0;

    background:rgba(255,255,255,.9);

    align-items:center;
    justify-content:center;

    flex-direction:column;

    z-index:100;
}

.gameover h2{
    color:#6d4c41;
    font-size:40px;
}

.gameover button{
    border:0;

    background:#8d6e63;
    color:white;

    padding:14px 25px;

    border-radius:15px;

    font-size:18px;
}

</style>

</head>

<body>

<div class="game">

<div class="info">

<h1>404</h1>

<h2>🌱 صفحه پیدا نشد!</h2>

<p>ولی یه بازی کوچولو منتظرته 😍</p>

</div>

<div class="score">

امتیاز: <span id="score">0</span>

</div>

<div id="player" class="player">

🍄

</div>

<div class="ground"></div>

<a href="index.html" class="home">

🏠 برگشت به شگفتا

</a>

<div id="gameover" class="gameover">

<h2>💥 باختی!</h2>

<p>قارچ به آدمک خورد 😄</p>

<button onclick="location.reload()">

🔄 دوباره بازی

</button>

</div>

</div>


<script>

const player =
document.getElementById("player");

const scoreText =
document.getElementById("score");

const gameover =
document.getElementById("gameover");

let score = 0;

let playing = true;


/* پرش */

function jump(){

    if(!playing) return;

    if(player.classList.contains("jump"))
        return;

    player.classList.add("jump");

    setTimeout(function(){

        player.classList.remove("jump");

    },700);

}


/* ساخت قارچ */

function makeObstacle(){

    if(!playing) return;

    const mushroom =
    document.createElement("div");

    mushroom.className="obstacle";

    mushroom.innerHTML="🍄";

    document.querySelector(".game")
    .appendChild(mushroom);


    const check =
    setInterval(function(){

        if(!playing){

            clearInterval(check);
            return;

        }

        const p =
        player.getBoundingClientRect();

        const m =
        mushroom.getBoundingClientRect();


        if(

            p.left < m.right &&
            p.right > m.left &&
            p.top < m.bottom &&
            p.bottom > m.top

        ){

            playing=false;

            clearInterval(check);

            gameover.style.display="flex";

        }

    },20);


    mushroom.addEventListener(
        "animationend",
        function(){

            if(playing){

                score++;

                scoreText.textContent=score;

            }

            clearInterval(check);

            mushroom.remove();

        }
    );

}


/* تولید قارچ‌ها */

setInterval(function(){

    makeObstacle();

},1800);


/* اولین قارچ */

setTimeout(function(){

    makeObstacle();

},500);


/* کیبورد */

document.addEventListener(
"keydown",
function(e){

    if(
        e.code==="Space" ||
        e.code==="ArrowUp"
    ){

        e.preventDefault();

        jump();

    }

});


/* موبایل */

document.addEventListener(
"touchstart",
function(){

    jump();

});

</script>

</body>

</html>
