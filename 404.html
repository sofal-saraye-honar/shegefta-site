<!DOCTYPE html><html lang="fa" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>شگفتا | ۴۰۴</title><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    background:#f7f2e8;
    color:#4e342e;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.page{
    width:min(95%,900px);
    text-align:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.title{
    font-size:38px;
    margin:5px 0;
}

.subtitle{
    margin:5px 0 20px;
    color:#777;
}

/* بازی */

.game{
    position:relative;
    width:100%;
    height:260px;
    background:
        linear-gradient(#e8f5e9 0 68%,#fff 68% 100%);
    border-radius:25px;
    overflow:hidden;
    border:3px solid #d7c4a3;
    box-shadow:0 12px 30px rgba(80,60,40,.15);
}

/* ابرها */

.cloud{
    position:absolute;
    font-size:38px;
    opacity:.65;
}

.cloud.one{
    top:25px;
    left:18%;
}

.cloud.two{
    top:65px;
    left:70%;
}

/* زمین */

.ground{
    position:absolute;
    bottom:42px;
    left:0;
    width:100%;
    height:5px;
    background:#795548;
}

/* آدمک */

.player{
    position:absolute;
    left:70px;
    bottom:47px;
    width:42px;
    height:65px;
    z-index:5;
}

.head{
    position:absolute;
    top:0;
    left:7px;
    width:29px;
    height:29px;
    background:#ffd7b5;
    border-radius:50%;
    border:2px solid #5d4037;
}

.hat{
    position:absolute;
    top:-5px;
    left:2px;
    width:39px;
    height:16px;
    background:#e53935;
    border-radius:20px 20px 5px 5px;
}

.body{
    position:absolute;
    top:27px;
    left:9px;
    width:25px;
    height:25px;
    background:#2196f3;
    border-radius:6px;
}

.leg{
    position:absolute;
    top:48px;
    width:8px;
    height:18px;
    background:#5d4037;
    border-radius:5px;
}

.leg.left{
    left:9px;
}

.leg.right{
    right:9px;
}

/* حالت پرش */

.player.jump{
    animation:jump .65s ease-out;
}

@keyframes jump{

    0%{
        bottom:47px;
    }

    45%{
        bottom:155px;
    }

    100%{
        bottom:47px;
    }

}

/* مانع */

.obstacle{
    position:absolute;
    bottom:47px;
    right:-50px;
    width:35px;
    height:55px;
    background:#43a047;
    border-radius:8px 8px 3px 3px;
    border:3px solid #2e7d32;
}

.obstacle::before{
    content:"";
    position:absolute;
    top:-13px;
    left:-5px;
    width:39px;
    height:15px;
    background:#66bb6a;
    border-radius:50%;
}

/* امتیاز */

.score{
    position:absolute;
    top:15px;
    right:20px;
    font-size:18px;
    font-weight:bold;
    z-index:10;
}

/* شروع */

.start-message{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:rgba(255,255,255,.45);
    z-index:20;
}

.start-message strong{
    font-size:22px;
    margin-bottom:10px;
}

.start-message span{
    color:#666;
}

/* دکمه */

.home-btn{
    display:inline-block;
    margin-top:22px;
    padding:13px 28px;
    border-radius:30px;
    background:#00897b;
    color:white;
    text-decoration:none;
    font-size:17px;
}

.home-btn:hover{
    transform:translateY(-2px);
}

/* موبایل */

@media(max-width:600px){

    .title{
        font-size:30px;
    }

    .game{
        height:230px;
    }

    .player{
        left:45px;
    }

}

</style></head><body><div class="page"><div class="logo">
✨ شگفتا ✨
</div><h1 class="title">
۴۰۴
</h1><p class="subtitle">
این صفحه پیدا نشد؛ اما یک بازی کوچک منتظر توست! 🎮
</p><div class="game" id="game"><div class="score">
امتیاز: <span id="score">0</span>
</div><div class="cloud one">
☁️
</div><div class="cloud two">
☁️
</div><div class="ground"></div><!-- آدمک قارچ‌خور --><div class="player" id="player"><div class="hat"></div><div class="head"></div><div class="body"></div><div class="leg left"></div><div class="leg right"></div></div><!-- مانع --><div class="obstacle" id="obstacle"></div><div class="start-message" id="startMessage"><strong>
🎮 برای شروع بپر!
</strong><span>
با Space یا لمس صفحه
</span></div></div><a href="index.html" class="home-btn">
🏠 برگشت به شگفتا
</a></div><script>

const player =
document.getElementById("player");

const obstacle =
document.getElementById("obstacle");

const scoreText =
document.getElementById("score");

const startMessage =
document.getElementById("startMessage");

let playing = false;

let score = 0;

let obstacleX = -50;

let speed = 6;

let jumping = false;


/* شروع بازی */

function startGame(){

    if(!playing){

        playing = true;

        startMessage.style.display = "none";

        gameLoop();

    }

    jump();

}


/* پرش */

function jump(){

    if(jumping) return;

    jumping = true;

    player.classList.add("jump");

    setTimeout(function(){

        player.classList.remove("jump");

        jumping = false;

    },650);

}


/* کنترل صفحه */

document.addEventListener("keydown",function(e){

    if(
        e.code === "Space" ||
        e.code === "ArrowUp"
    ){

        e.preventDefault();

        startGame();

    }

});


document.getElementById("game")
.addEventListener("touchstart",function(){

    startGame();

});


document.getElementById("game")
.addEventListener("mousedown",function(){

    startGame();

});


/* بازی */

function gameLoop(){

    if(!playing) return;

    obstacleX -= speed;

    obstacle.style.right =
    obstacleX + "px";


    /* رسیدن مانع به بازیکن */

    if(obstacleX < 90 && obstacleX > 25){

        if(!jumping){

            gameOver();

            return;

        }

    }


    /* عبور از مانع */

    if(obstacleX < -60){

        obstacleX = 0;

        score++;

        scoreText.textContent = score;

        if(score % 5 === 0){

            speed += .5;

        }

    }


    requestAnimationFrame(gameLoop);

}


/* پایان */

function gameOver(){

    playing = false;

    startMessage.innerHTML =
    "<strong>💥 باختی!</strong>" +
    "<span>برای بازی دوباره لمس کن</span>";

    startMessage.style.display = "flex";

    startMessage.onclick = function(){

        resetGame();

    };

}


/* شروع دوباره */

function resetGame(){

    score = 0;

    speed = 6;

    obstacleX = -50;

    scoreText.textContent = "0";

    startMessage.onclick = null;

    startMessage.style.display = "none";

    playing = true;

    gameLoop();

    jump();

}

</script></body></html>
