<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>شگفتا | صفحه پیدا نشد</title><style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    font-family:Tahoma, Arial, sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    color:#5d4037;

    background:
    radial-gradient(circle at top, #fffdf5, #e8f5e9);

    overflow:hidden;
}


/* ستاره‌های پس‌زمینه */

.star{

    position:fixed;

    color:#ffd54f;

    font-size:20px;

    animation:twinkle 2s infinite alternate;

    pointer-events:none;
}

@keyframes twinkle{

    from{
        opacity:.2;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.2);
    }

}


/* کارت اصلی */

.error-card{

    width:min(92%,650px);

    padding:35px 25px 40px;

    background:rgba(255,255,255,.9);

    border-radius:30px;

    box-shadow:
    0 15px 45px rgba(93,64,55,.18);

    position:relative;

    z-index:2;
}


/* جغد */

.owl{

    font-size:70px;

    animation:owlMove 2s infinite ease-in-out;
}

@keyframes owlMove{

    0%,100%{
        transform:rotate(-5deg);
    }

    50%{
        transform:rotate(5deg) translateY(-8px);
    }

}


/* نقشین */

.avatar{

    width:100px;

    height:100px;

    object-fit:contain;

    margin:10px auto;

    display:block;

    border-radius:50%;
}


/* متن */

h1{

    font-size:42px;

    margin:10px 0;

    color:#6d4c41;
}

h2{

    color:#00897b;

    margin:10px 0 20px;
}

.message{

    font-size:18px;

    line-height:2;

}


/* بازی */

.game-box{

    margin:25px auto;

    padding:20px;

    border-radius:20px;

    background:#fdf7ef;

    border:2px dashed #d7b98c;
}

.game-title{

    font-size:20px;

    margin-bottom:10px;
}

.score{

    font-size:18px;

    font-weight:bold;

    color:#00897b;
}


/* ستاره بازی */

.game-star{

    display:inline-block;

    font-size:45px;

    cursor:pointer;

    user-select:none;

    transition:.2s;

    animation:gameStar 1.5s infinite alternate;
}

.game-star:hover{

    transform:scale(1.3) rotate(15deg);
}

@keyframes gameStar{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-8px);
    }

}


/* دکمه */

.home-btn{

    display:inline-block;

    margin-top:20px;

    padding:14px 28px;

    border-radius:30px;

    background:#00897b;

    color:white;

    text-decoration:none;

    font-size:17px;

    opacity:.45;

    pointer-events:none;

    transition:.3s;
}

.home-btn.active{

    opacity:1;

    pointer-events:auto;
}

.home-btn:hover{

    transform:translateY(-3px);

    box-shadow:0 8px 20px rgba(0,137,123,.25);
}


/* موبایل */

@media(max-width:500px){

    h1{
        font-size:32px;
    }

    h2{
        font-size:21px;
    }

    .message{
        font-size:16px;
    }

    .owl{
        font-size:60px;
    }

}

</style></head><body><!-- ستاره‌های پس‌زمینه --><div class="star" style="top:8%;left:10%;">✨</div>
<div class="star" style="top:20%;left:85%;">⭐</div>
<div class="star" style="top:70%;left:8%;">✨</div>
<div class="star" style="top:80%;left:90%;">⭐</div>
<div class="star" style="top:45%;left:5%;">🌟</div>
<div class="star" style="top:12%;left:50%;">✨</div><div class="error-card"><!-- جغد --><div class="owl">

<h1>
۴۰۴
</h1><h2>
🌱 این صفحه گم شده!
</h2><p class="message">نقشین و جغد شگفتا همه‌جا را گشتند،
اما این صفحه را پیدا نکردند! 😅

<br>شاید آدرس را اشتباه زده‌ای...
اما قبل از برگشتن یک بازی کوچولو داریم! 🎮

</p><!-- بازی --><div class="game-box"><div class="game-title">⭐ روی ستاره کلیک کن!

</div><div class="score">امتیاز:
<span id="score">0</span>
از 5

</div><br><div
id="gameStar"
class="game-star"
onclick="catchStar()">⭐

</div></div><!-- دکمه خانه --><a
id="homeBtn"
href="index.html"
class="home-btn">

🏠 برگشت به شگفتا

</a></div><script>

let score = 0;

function catchStar(){

    score++;

    document.getElementById("score").textContent = score;

    const star =
    document.getElementById("gameStar");

    if(score < 5){

        star.textContent = "✨";

        setTimeout(function(){

            star.textContent = "⭐";

        },300);

    }

    if(score >= 5){

        star.textContent = "🎉";

        document.querySelector(".game-title").textContent =
        "آفرین! صفحه پیدا شد! 🎉";

        document.getElementById("homeBtn")
        .classList.add("active");

    }

}

</script></body></html>
