<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شگفتا | صفحه پیدا نشد</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:linear-gradient(#bde9ff,#fdf7ef);
    text-align:center;
    overflow:hidden;
}

.game{
    position:relative;
    width:100%;
    height:100vh;
    min-height:500px;
    overflow:hidden;
}

.title{
    padding-top:40px;
    color:#6d4c41;
}

.title h1{
    font-size:70px;
    margin:0;
}

.title h2{
    margin:5px 0;
}

.title p{
    color:#666;
}

/* زمین */

.ground{
    position:absolute;
    bottom:80px;
    left:0;
    width:100%;
    height:8px;
    background:#6d4c41;
}

/* آدمک */

.player{
    position:absolute;
    bottom:88px;
    left:120px;
    width:55px;
    height:65px;
    font-size:55px;
    line-height:65px;
    z-index:5;
}

/* حالت پرش */

.jump{
    animation:jump .75s ease-out;
}

@keyframes jump{

    0%{
        bottom:88px;
    }

    50%{
        bottom:260px;
    }

    100%{
        bottom:88px;
    }

}

/* مانع */

.obstacle{
    position:absolute;
    bottom:88px;
    right:-70px;

    width:55px;
    height:65px;

    font-size:50px;
    line-height:65px;

    animation:moveObstacle 2.8s linear forwards;
}

@keyframes moveObstacle{

    from{
        right:-70px;
    }

    to{
        right:110%;
    }

}

/* امتیاز */

.score{
    position:absolute;
    top:25px;
    left:25px;

    background:white;
    padding:10px 18px;

    border-radius:15px;

    font-size:20px;

    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

/* پیام باخت */

.game-over{
    display:none;

    position:absolute;

    inset:0;

    background:rgba(255,255,255,.85);

    align-items:center;
    justify-content:center;

    flex-direction:column;

    z-index:20;
}

.game-over h2{
    font-size:40px;
    color:#6d4c41;
}

.game-over button{
    border:none;

    padding:14px 25px;

    border-radius:15px;

    background:#8d6e63;

    color:white;

    font-size:18px;

    cursor:pointer;
}

    position:absolute;
    bottom:20px;
    left:50%;
